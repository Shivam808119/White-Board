<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b25"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Board"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>Board — your shared scratchpad</title><script defer src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script defer src="app.js"></script></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">✳</span><div><strong>board<span>.</span></strong><small>YOUR SHARED SCRATCHPAD</small></div></div><div class="top-actions"><div id="status" class="status">Starting…</div><button id="join" class="join">Join</button><button id="share" class="share">↗ <span>Share board</span></button><button id="fullscreen" class="icon-button" aria-label="Full screen">⛶</button></div></header>
<link rel="stylesheet" href="fullscreen.css"><style>.join{background:#edf1eb;color:#315342;border-radius:10px;padding:10px;font-weight:650!important}@media(max-width:600px){.join{padding:8px;font-size:12px!important}.top-actions{gap:5px}}</style><main><section class="workspace"><div class="workspace-heading"><div><span class="eyebrow">YOUR SPACE TO THINK</span><h1>Make a little room for ideas<span>.</span></h1></div><div class="heading-side">● &nbsp; YOUR BOARD</div></div><div class="canvas-area"><div class="paper-wrap"><div class="paper"><canvas id="board" aria-label="Drawing board"></canvas><button id="exit-fullscreen" aria-label="Exit full screen" title="Exit full screen">⤢</button></div></div></div><div class="below"><span>✎ &nbsp; MADE FOR THINKING, NOT PERFECTION</span><span>YOUR SHARED SCRATCHPAD</span></div></section></main>
<nav class="toolbar" aria-label="Drawing tools"><button id="pen" class="tool selected"><span>✎</span><small>Pen</small></button><button id="erase" class="tool"><span>◒</span><small>Eraser</small></button><label class="size-control">COLOR <input id="color" type="color" value="#233c2e" aria-label="Pen color"></label><label class="size-control">SIZE <input id="size" type="range" min="2" max="16" value="4" aria-label="Pen size"></label><button id="undo" class="tool"><span>↶</span><small>Undo</small></button><button id="clear" class="tool"><span>⌫</span><small>Clear</small></button><button id="zoom-out" class="tool"><span>−</span><small>Zoom</small></button><button id="zoom-in" class="tool"><span>+</span><small>Zoom</small></button><button id="export" class="tool"><span>↓</span><small>Save PNG</small></button></nav>
<div id="connection" class="connection"><div class="connection-icon">↗</div><div><strong>Better together.</strong><p>Open this same board on your other device to see your writing live.</p></div><button id="copy">Copy link</button><button id="dismiss" aria-label="Dismiss">×</button></div><div id="message" role="status"></div><script>if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
